pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Chaquopy's embedded Python, used by Vitrola's yt-dlp.
        maven { url 'https://chaquo.com/maven' }
        maven { url 'https://chaquo.com/pypi-13.1/' }
    }
}

rootProject.name = 'NastyTour'
include ':app'
// Vitrola embeds yt-dlp in Python through the yt-dlp-android library (a local checkout).
if (providers.gradleProperty('nastyApp').getOrElse('tour') == 'vitrola') {
    def ytdlpRoot = providers.gradleProperty('ytdlpAndroidRoot').getOrElse("${System.getProperty('user.home')}/prog/yt-dlp-android")
    include ':ytdlp'
    project(':ytdlp').projectDir = file("${ytdlpRoot}/library")
}
