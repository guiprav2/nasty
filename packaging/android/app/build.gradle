plugins {
    id 'com.android.application'
}

def repositoryRoot = rootProject.file('../..')
def generatedAssets = layout.buildDirectory.dir('generated/nastyAssets')
// -PnastyApp=<name> packages another Nasty app; each has an entry script and manifest.
def nastyApp = (findProperty('nastyApp') ?: 'tour').toString()
def nastyApps = [
    tour: [id: 'org.nasty.tour', entry: 'node/examples/tour.js', manifest: 'src/main/AndroidManifest.xml'],
    dyndyn: [id: 'org.nasty.dyndyn', entry: 'node/examples/dyndyn/mobile.js', manifest: 'src/dyndyn/AndroidManifest.xml'],
]
def nastyAppConfig = nastyApps[nastyApp]
if (nastyAppConfig == null) throw new GradleException("Unknown nastyApp '${nastyApp}'")
// Android Skia binding for @napi-rs/canvas, unpacked outside node_modules by the APK script.
def canvasAndroid = findProperty('nastyCanvasAndroid')

tasks.register('prepareNastyAssets', Sync) {
    into generatedAssets
    from(repositoryRoot.toPath().resolve('node').toFile()) {
        into 'nasty/node'
        exclude 'native/**', 'runtime/**', 'node_modules/**', 'examples/*.svg'
    }
    from(repositoryRoot.toPath().resolve('node/node_modules').toFile()) {
        into 'nasty/node/node_modules'
        exclude '@napi-rs/canvas-linux-*/**'
    }
    from(repositoryRoot.toPath().resolve('fonts').toFile()) {
        into 'nasty/fonts'
    }
    if (canvasAndroid) {
        from(file(canvasAndroid)) {
            into 'nasty/node/node_modules/@napi-rs/canvas-android-arm64'
        }
    }
}

tasks.register('generateNastyAssetManifest') {
    dependsOn tasks.named('prepareNastyAssets')
    outputs.file(generatedAssets.map { it.file('nasty/files.list') })
    doLast {
        def payloadRoot = new File(generatedAssets.get().asFile, 'nasty')
        def manifest = new File(payloadRoot, 'files.list')
        manifest.parentFile.mkdirs()
        new File(payloadRoot, 'entry').text = nastyAppConfig.entry + '\n'
        manifest.text = fileTree(payloadRoot)
            .files
            .findAll { it != manifest }
            .collect { payloadRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
            .findAll { path -> !path.split('/').any { segment -> segment.startsWith('.') } }
            .sort()
            .join('\n') + '\n'
    }
}

android {
    namespace 'org.nasty.tour'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId nastyAppConfig.id
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets {
        main {
            assets.srcDir generatedAssets
            manifest.srcFile nastyAppConfig.manifest
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateNastyAssetManifest')
}
