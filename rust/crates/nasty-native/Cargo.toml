[package]
name = "nasty-native"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "block_layout", "taffy_tree"] }
bytemuck = { version = "1", features = ["derive"] }
egui = "=0.31.1"
egui-winit = { version = "=0.31.1", default-features = false, features = ["clipboard", "wayland", "x11"] }
fontdb = "=0.16.2"
glyphon = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
pollster = "0.4"
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "android-native-activity"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[build-dependencies]
napi-build = "2"
cc = "1"
