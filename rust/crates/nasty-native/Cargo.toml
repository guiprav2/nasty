[package]
name = "nasty-native"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
libc = "0.2"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "block_layout", "grid", "taffy_tree"] }
bytemuck = { version = "1", features = ["derive"] }
egui = "=0.31.1"
egui-winit = { version = "=0.31.1", default-features = false, features = ["clipboard", "wayland", "x11"] }
fontdb = "=0.16.2"
glyphon = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
jpeg-decoder = { version = "0.3", default-features = false }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
base64 = "0.22"
percent-encoding = "2"
pollster = "0.4"
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
webrtc = { version = "0.21.1", default-features = false, features = ["runtime-tokio", "crypto-ring"] }
rtc = { version = "=0.21.1", default-features = false, features = ["crypto-ring"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"
bytes = "1"
serde_json = "1"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "android-native-activity"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.9"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[build-dependencies]
napi-build = "2"
cc = "1"
