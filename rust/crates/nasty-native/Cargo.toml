[package]
name = "nasty-native"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
taffy = { version = "0.14", default-features = false, features = ["std", "flexbox", "block_layout", "taffy_tree"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = { version = "24", default-features = false, features = ["wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[build-dependencies]
napi-build = "2"
